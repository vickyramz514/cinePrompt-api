name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Set EC2_DEPLOY_ENABLED to "true" after configuring the EC2_* secrets.
    if: ${{ vars.EC2_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/cinePrompt-api
            git pull origin main
            npm ci
            pm2 restart cinePrompt-api